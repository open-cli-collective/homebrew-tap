name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Reject deprecated install-step stanzas
        shell: bash
        run: |
          if grep -REn '^[[:space:]]*(preflight|postflight|uninstall_preflight|uninstall_postflight)[[:space:]]+do' Casks; then
            echo 'Use the corresponding *_steps Homebrew cask stanza.' >&2
            exit 1
          fi
      - name: Check Homebrew style
        run: brew style --only-cops Cask/InstallSteps,Homebrew/OSDependsOn Casks/*.rb
